name: Publicar Treinacamp no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Separar arquivos públicos
        run: |
          mkdir dist
          cp index.html styles.css app.js config.js qr.html .nojekyll dist/
          cp -r assets dist/
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
