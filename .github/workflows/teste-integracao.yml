name: Testar Treinacamp - cadastro cumulativo e painel
on:
  push:
    paths:
      - '.github/workflows/teste-integracao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e estrutura
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          code=Path('app.js').read_text(encoding='utf-8')
          for marker in ('statParticipants','statEligible','exportMode','deleteModal','deleteBackdrop','confirmDelete','cancelDelete','referralRows','studentSocial','friendsGrid'):
              assert 'id="'+marker+'"' in html,marker
          assert 'id="qrSide"' not in html
          for marker in ("request('criar_lote'","request('listar'","request('atualizar'","excluir_indicacao","excluir_aluno","visibleGroups"):
              assert marker in code,marker
          print('Estrutura de cadastro e painel válida')
          PY
      - name: Testar interface com navegador simulado
        run: |
          npm install --no-save --no-audit --no-fund jsdom@26
          cat > _test-ui.cjs <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {JSDOM}=require('jsdom');
          async function main(){
            const dom=new JSDOM(fs.readFileSync('index.html','utf8'),{
              url:'https://orisee1.github.io/treinacamp-amigo-da-onca/',
              runScripts:'outside-only',pretendToBeVisual:true
            });
            const w=dom.window;
            w.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});
            w.HTMLElement.prototype.scrollIntoView=function(){};
            w.HTMLElement.prototype.focus=function(){};
            w.TREINACAMP_CONFIG={SUPABASE_URL:'https://dummy.supabase.co',BONUS_POR_MATRICULA:50};
            const sent=[];
            const records=[
              {id:'11111111-1111-4111-8111-111111111111',aluno_nome:'Maria Da Silva',aluno_whatsapp:'11911111111',aluno_rede_social:'@maria',amigo_nome:'Amigo Um',amigo_whatsapp:'11911111112',status:'pendente',criado_em:'2026-10-16T12:00:00Z'},
              {id:'22222222-2222-4222-8222-222222222222',aluno_nome:'  MARIA  DA SILVA ',aluno_whatsapp:'11911111111',amigo_nome:'Amigo Dois',amigo_whatsapp:'11911111113',status:'matriculado',criado_em:'2026-10-16T12:05:00Z'},
              {id:'33333333-3333-4333-8333-333333333333',aluno_nome:'Pedro Souza',aluno_whatsapp:'11922222222',amigo_nome:'Amigo Tres',amigo_whatsapp:'11922222223',status:'pendente',criado_em:'2026-10-16T12:05:00Z'},
            ];
            w.fetch=async (_url,options)=>{
              const body=JSON.parse(options.body);sent.push(body);
              const result=body.action==='criar_lote'?{ok:true,quantidade:body.amigos.length,total_acumulado:body.amigos.length,apto:false}:
                body.action==='login'?{ok:true,token:'fake-session'}:
                body.action==='listar'?{indicacoes:records}:
                body.action==='atualizar'?{ok:true}:
                body.action==='verificar'?{ok:true}:{ok:true};
              return {ok:true,status:200,json:async()=>result};
            };
            w.eval(fs.readFileSync('app.js','utf8'));
            const $=id=>w.document.getElementById(id);
            assert.equal($('friendsCount').textContent,'0 neste envio');
            $('studentName').value='Maria da Silva';
            $('studentPhone').value='11911111111';
            $('friendName').value='Amigo Simulado';
            $('friendPhone').value='11933333333';
            $('addFriendBtn').click();
            assert.equal($('friendsGrid').children.length,1);
            assert.equal($('friendsCount').textContent,'1 neste envio');
            $('consent').checked=true;
            $('referralForm').dispatchEvent(new w.Event('submit',{cancelable:true,bubbles:true}));
            await new Promise(r=>setTimeout(r,25));
            assert.equal(sent.filter(x=>x.action==='criar_lote').length,1);
            assert.equal(sent.find(x=>x.action==='criar_lote').amigos.length,1);
            assert.equal($('successModal').hidden,false);
            assert.match($('celebrationMessage').textContent,/Faltam 9/);
            $('newReferralBtn').click();
            assert.equal($('studentName').value,'Maria da Silva');
            assert.equal($('friendsGrid').children.length,0);
            w.document.dispatchEvent(new w.KeyboardEvent('keydown',{altKey:true,shiftKey:true,key:'E',bubbles:true}));
            $('adminPin').value='teste';
            $('loginForm').dispatchEvent(new w.Event('submit',{cancelable:true,bubbles:true}));
            await new Promise(r=>setTimeout(r,25));
            assert.equal($('statParticipants').textContent,'2');
            assert.equal($('statTotal').textContent,'3');
            assert.equal($('statEligible').textContent,'0');
            assert.equal($('referralRows').querySelectorAll('.group-main-row').length,2);
            $('referralRows').querySelector('.btn-expand').click();
            assert.equal($('referralRows').querySelectorAll('.group-detail-table tbody tr').length,2);
            $('referralRows').querySelector('.btn-delete-item').click();
            assert.equal($('deleteModal').hidden,false);
            assert.match($('deleteDescription').textContent,/somente a indicação/i);
            $('cancelDelete').click();
            assert.equal($('deleteModal').hidden,true);
            $('referralRows').querySelector('.btn-delete-group').click();
            assert.match($('deleteDescription').textContent,/TODAS/);
            $('cancelDelete').click();
            const exported=[];
            w.XLSX={utils:{book_new:()=>({}),aoa_to_sheet:rows=>({rows,'!ref':'A1:H3'}),book_append_sheet:(wb,sheet,name)=>{wb[name]=sheet;}},writeFile:(wb,name)=>exported.push({wb,name})};
            $('exportXlsx').click();
            assert.equal(exported[0].wb['Por aluno'].rows.length,3);
            $('exportMode').value='detalhado';
            $('exportXlsx').click();
            assert.equal(exported[1].wb['Por indicação'].rows.length,4);
            const pdf=[];
            w.jspdf={jsPDF:class {
              constructor(){this.internal={getCurrentPageInfo:()=>({pageNumber:1})};}
              setFillColor(){} rect(){} setTextColor(){} setFont(){} setFontSize(){} text(){}
              autoTable(options){pdf.push({head:options.head,body:options.body});}
              save(filename){pdf[pdf.length-1].filename=filename;}
            }};
            $('exportMode').value='simples';$('exportPdf').click();
            assert.equal(pdf[0].body.length,2);
            assert.match(pdf[0].filename,/Simples/);
            $('exportMode').value='detalhado';$('exportPdf').click();
            assert.equal(pdf[1].body.length,3);
            assert.match(pdf[1].filename,/Detalhado/);
            console.log('Interface dinâmica, agrupamento, expandir, confirmações e Excel OK.');
            dom.window.close();
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node _test-ui.cjs
